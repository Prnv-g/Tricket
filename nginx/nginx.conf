worker_processes auto;
events { worker_connections 2048; }
http {
  include mime.types;
  server_tokens off;
  gzip on;
  gzip_min_length 500;
  gzip_types application/json text/css application/javascript;
  map $http_upgrade $upgrade_connection {
    default upgrade;
    '' close;
  }
  upstream api {
    zone seatsurge_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api-a:8000 resolve max_fails=1 fail_timeout=3s;
    server api-b:8000 resolve max_fails=1 fail_timeout=3s;
    keepalive 32;
  }
  server {
    listen 8080;
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_504;
    proxy_next_upstream_tries 2;
    location /api/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_pass http://api;
    }
    location /ws/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $upgrade_connection;
      proxy_read_timeout 65s;
      proxy_pass http://api;
    }
    location / {
      resolver 127.0.0.11 valid=5s ipv6=off;
      set $frontend http://frontend:80;
      proxy_pass $frontend;
    }
  }
}
